<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Brand Gradient for HANVI Text -->
    <linearGradient id="hanviTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E51D24" />
      <stop offset="25%" stop-color="#F2381E" />
      <stop offset="52%" stop-color="#FF6A00" />
      <stop offset="80%" stop-color="#FFA800" />
      <stop offset="100%" stop-color="#FFD200" />
    </linearGradient>

    <!-- Brand Gradient for GLOBAL TECH Subtitle -->
    <linearGradient id="hanviSubtitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E51D24" />
      <stop offset="45%" stop-color="#F95010" />
      <stop offset="80%" stop-color="#FF7D00" />
      <stop offset="100%" stop-color="#FFAE00" />
    </linearGradient>

    <!-- Brand Gradient for Circular Emblem -->
    <linearGradient id="emblemRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E51D24" />
      <stop offset="30%" stop-color="#F33C1B" />
      <stop offset="65%" stop-color="#FF6F00" />
      <stop offset="100%" stop-color="#FFC200" />
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ==================== CIRCULAR EMBLEM (Centered on cx=60, cy=60) ==================== -->
  <g transform="translate(6, 0)">
    <!-- Outer Circuit Ring Base -->
    <circle cx="60" cy="60" r="49" stroke="url(#emblemRingGrad)" stroke-width="4.5" />
    
    <!-- Concentric Inner Circuit Track (Segmented) -->
    <circle cx="60" cy="60" r="41" stroke="url(#emblemRingGrad)" stroke-width="2.5" stroke-dasharray="32 10 24 14 38 12" stroke-linecap="round" />

    <!-- Outer Circuit Nodes (Connecting Dots) -->
    <circle cx="60" cy="11" r="4" fill="url(#emblemRingGrad)" />
    <circle cx="95" cy="25" r="4" fill="url(#emblemRingGrad)" />
    <circle cx="109" cy="60" r="4" fill="url(#emblemRingGrad)" />
    <circle cx="11" cy="60" r="4" fill="url(#emblemRingGrad)" />
    <circle cx="25" cy="95" r="4" fill="url(#emblemRingGrad)" />
    <circle cx="60" cy="109" r="4" fill="url(#emblemRingGrad)" />

    <!-- Small Inner Tech Highlights -->
    <circle cx="60" cy="19" r="2.2" fill="#FFFFFF" opacity="0.9" />
    <circle cx="101" cy="60" r="2.2" fill="#FFFFFF" opacity="0.9" />
    <circle cx="19" cy="60" r="2.2" fill="#FFFFFF" opacity="0.9" />

    <!-- Bold Central Letter "H" -->
    <!-- Left vertical stem -->
    <rect x="29" y="32" width="10" height="56" rx="2" fill="url(#emblemRingGrad)" />
    <!-- Horizontal Crossbar -->
    <rect x="29" y="55" width="29" height="10" rx="1.5" fill="url(#emblemRingGrad)" />
    <!-- Right vertical stem -->
    <rect x="48" y="32" width="10" height="56" rx="2" fill="url(#emblemRingGrad)" />

    <!-- Globe Sphere (Connected right of H) -->
    <!-- Globe Outer Arc -->
    <path d="M 58 32 A 32 32 0 0 1 58 88" fill="none" stroke="url(#emblemRingGrad)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Globe Equator Line -->
    <line x1="58" y1="60" x2="90" y2="60" stroke="url(#emblemRingGrad)" stroke-width="3" stroke-linecap="round" />
    <!-- Globe Meridian Lines -->
    <path d="M 58 32 C 78 36, 84 48, 84 60 C 84 72, 78 84, 58 88" fill="none" stroke="url(#emblemRingGrad)" stroke-width="2.5" />
    <path d="M 58 32 C 68 38, 72 48, 72 60 C 72 72, 68 82, 58 88" fill="none" stroke="url(#emblemRingGrad)" stroke-width="2" />

    <!-- Pointer Cursor Arrow (Bottom Right, pointing at the center) -->
    <polygon points="86,72 104,90 95,93 103,106 97,110 89,97 81,103" fill="#FFFFFF" stroke="url(#emblemRingGrad)" stroke-width="2.8" stroke-linejoin="round" />
  </g>

  <!-- ==================== PERFECT STRAIGHT TYPOGRAPHY ==================== -->
  <g transform="translate(136, 0)">
    <!-- HANVI Primary Brand Name -->
    <text x="0" y="70" font-family="'Montserrat', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="64" font-weight="900" fill="url(#hanviTitleGrad)" letter-spacing="2">HANVI</text>

    <!-- GLOBAL TECH PVT LTD Subtitle (Straight horizontal baseline) -->
    <text x="2" y="98" font-family="'Montserrat', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="18.5" font-weight="800" fill="url(#hanviSubtitleGrad)" letter-spacing="3.2">GLOBAL TECH PVT LTD</text>
  </g>
</svg>
